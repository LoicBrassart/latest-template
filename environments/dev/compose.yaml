x-baseService: &baseService
  restart: always
  healthcheck:
    interval: 1s
    timeout: 2s
    retries: 10

services:
  gateway:
    container_name: gateway
    <<: *baseService
    image: nginx
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/dev.conf.template
    ports:
      - ${GATEWAY_PORT}:80
    depends_on:
      # backend:
      #   condition: service_healthy
      frontend:
        condition: service_healthy
      adminer:
        condition: service_started
    command: /bin/bash -c "envsubst '$$BACKEND_PORT' < /etc/nginx/conf.d/dev.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

  database:
    container_name: database
    <<: *baseService
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_HOST} -U ${DB_USER}"]
    volumes:
      - ./persist/database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_SCHEMA}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_HOST: ${DB_HOST}

  adminer:
    container_name: adminer
    <<: *baseService
    image: adminer
    depends_on:
      database:
        condition: service_healthy

  # backend:
  #   container_name: backend

  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.dev
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         'curl --fail -X POST -H ''Content-Type: application/json'' -d ''{"query":"query { __typename }"}'' http://backend:${BACKEND_PORT} || exit 1',
  #       ]
  #   depends_on:
  #     database:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend/src:/app/src/
  #   environment:
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     DB_DATABASE: ${DB_SCHEMA}
  #     DB_USER: ${DB_USER}
  #     DB_HOST: ${DB_HOST}
  #     JWT_SECRET: ${JWT_SECRET}
  #     COOKIE_TTL: ${COOKIE_TTL}
  #     BACKEND_PORT: ${BACKEND_PORT}

  frontend:
    container_name: frontend
    <<: *baseService
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --request GET --url 'http://frontend:5173' || exit 1",
        ]
    # depends_on:
    #   codegen:

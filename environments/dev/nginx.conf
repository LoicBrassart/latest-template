events {}

http {
    server {
        listen 80;

        # location /api {
        #     proxy_pass http://backend:${SERVICE_PORT};
        # }

        location /vizualizer {
            # proxy_pass http://adminer:${SERVICE_PORT}; # TODO: This should work, I don't get why it doesn't
            proxy_pass http://adminer:8080;
        }

        location /hmr {
            proxy_pass http://frontend:${SERVICE_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://frontend:${SERVICE_PORT};
        }
    }
}